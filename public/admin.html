<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Overlay Controller</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .control-panel { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box; }
        
        .update-btn {
            width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold;
            background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;
            transition: background-color 0.2s;
        }
        .update-btn:hover { background-color: #0056b3; }

        .visibility-control {
            display: flex; justify-content: space-between; align-items: center;
            background: #e9ecef; padding: 10px; border-radius: 5px; margin-bottom: 20px;
        }
        .switch {
            position: relative; display: inline-block; width: 60px; height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>
    <div class="control-panel">
        <div class="visibility-control">
            <span style="font-weight:bold; font-size:1.1em;">OVERLAY VISIBILITY</span>
            <label class="switch">
                <input type="checkbox" id="checkVisible">
                <span class="slider"></span>
            </label>
        </div>

        <h2 style="text-align:center; margin-top:0;">Score Control</h2>
        
        <div class="row">
            <div class="col">
                <h3 style="color:#007bff; margin:0 0 10px 0;">LEFT TEAM</h3>
                <input type="text" id="inputNameLeft" placeholder="Name">
                <input type="number" id="inputScoreLeft" placeholder="Score">
            </div>
            <div class="col">
                <h3 style="color:#dc3545; margin:0 0 10px 0;">RIGHT TEAM</h3>
                <input type="text" id="inputNameRight" placeholder="Name">
                <input type="number" id="inputScoreRight" placeholder="Score">
            </div>
        </div>

        <label>Logo URL</label>
        <input type="text" id="inputLogo" placeholder="http://..." style="margin-bottom: 20px;">

        <button class="update-btn" onclick="sendData()">UPDATE STREAM</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('updateOverlay', (data) => {
            document.getElementById('checkVisible').checked = data.isVisible;
            document.getElementById('inputNameLeft').value = data.nameLeft;
            document.getElementById('inputScoreLeft').value = data.scoreLeft;
            document.getElementById('inputNameRight').value = data.nameRight;
            document.getElementById('inputScoreRight').value = data.scoreRight;
            document.getElementById('inputLogo').value = data.logoUrl;
        });

        function sendData() {
            const data = {
                isVisible: document.getElementById('checkVisible').checked, 
                nameLeft: document.getElementById('inputNameLeft').value,
                scoreLeft: document.getElementById('inputScoreLeft').value,
                nameRight: document.getElementById('inputNameRight').value,
                scoreRight: document.getElementById('inputScoreRight').value,
                logoUrl: document.getElementById('inputLogo').value
            };
            socket.emit('sendUpdate', data);
        }

        document.getElementById('checkVisible').addEventListener('change', function() {
            sendData();
        });
    </script>
</body>
</html>
